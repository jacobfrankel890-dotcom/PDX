<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDX Expense</title>
  <style>
    :root {
      --bg: #0f1419; --surface: #1a2332; --surface2: #243044; --border: #2d3a4f;
      --text: #e8edf4; --muted: #8b9cb3; --accent: #3b82f6; --success: #22c55e;
      --danger: #ef4444; --warn: #f59e0b; --radius: 10px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .logo { font-size: 1.35rem; font-weight: 700; }
    .logo span { color: var(--accent); }
    .dev-banner { background: #422006; color: #fcd34d; font-size: 0.8rem; padding: 8px 14px; border-radius: 8px; border: 1px solid #78350f; margin-bottom: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; }
    h2 { font-size: 1.05rem; margin-bottom: 16px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .stat-value { font-size: 1.35rem; font-weight: 700; }
    .stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 0.875rem; }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
    .badge-draft { background: #374151; color: #d1d5db; }
    .badge-submitted { background: #1e3a5f; color: #93c5fd; }
    .badge-approved { background: #14532d; color: #86efac; }
    .badge-rejected { background: #450a0a; color: #fca5a5; }
    .hidden { display: none !important; }
    .loading { text-align: center; padding: 32px; color: var(--muted); }
    .error { color: var(--danger); font-size: 0.85rem; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .btn { padding: 6px 12px; border: none; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; }
    .btn:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">PDX <span>Expense</span></div>
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>

    <div class="dev-banner">Dev mode — no sign-in. Showing all data from Supabase. Auth will be added later.</div>

    <div id="configWait" class="loading">Connecting to database…</div>
    <div id="errorBox" class="error hidden"></div>

    <div id="appView" class="hidden">
      <div class="stats" id="statsRow"></div>
      <div class="tabs">
        <button class="tab active" data-tab="expenses">All Expenses</button>
        <button class="tab" data-tab="reports">All Reports</button>
        <button class="tab" data-tab="employees">Employees</button>
      </div>

      <div id="tab-expenses">
        <div class="card">
          <h2>Recent expenses (all employees)</h2>
          <div id="expensesTable"><div class="loading">Loading…</div></div>
        </div>
      </div>

      <div id="tab-reports" class="hidden">
        <div class="card">
          <h2>All pay period reports</h2>
          <div id="reportsTable"><div class="loading">Loading…</div></div>
        </div>
      </div>

      <div id="tab-employees" class="hidden">
        <div class="card">
          <h2>Employees</h2>
          <div id="employeesTable"><div class="loading">Loading…</div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const COMPANIES = [
      { value: "cpx", label: "CPX — Canada" },
      { value: "pdx_north", label: "PDX North — Northeast US" },
      { value: "apx", label: "APX — Auto Parts Xpress" },
      { value: "pdx", label: "PDX — Parts Distribution Xpress" },
      { value: "pdx_south", label: "PDX South — Southeast US" },
      { value: "pdx_west", label: "PDX West — Northwest US" },
      { value: "apx_california", label: "APX California — Southwest US / California" },
    ];
    const POSITIONS = [
      { value: "kam", label: "KAM" },
      { value: "regional_manager", label: "Regional" },
    ];
    const CARD_TYPES = [
      { value: "rho", label: "Rho" },
      { value: "credit", label: "Credit" },
    ];
    const LEGACY_COMPANY = {
      "Parts Distribution Xpress": "pdx",
      "All Parts Xpress": "apx",
      "Auto Parts Xpress": "apx",
      CPX: "cpx",
    };
    function roleLabel(role) {
      return POSITIONS.find((p) => p.value === role)?.label || role || "—";
    }
    function normalizeCompanyKey(e) {
      const company = e?.company;
      const region = e?.region;
      if (!company) return region || "";
      if (COMPANIES.some((c) => c.value === company)) return company;
      if (LEGACY_COMPANY[company]) return LEGACY_COMPANY[company];
      if (COMPANIES.some((c) => c.value === region)) return region;
      return company;
    }
    function companyLabel(keyOrLegacy) {
      if (!keyOrLegacy) return "—";
      let key = keyOrLegacy;
      if (LEGACY_COMPANY[keyOrLegacy]) key = LEGACY_COMPANY[keyOrLegacy];
      const match = COMPANIES.find((c) => c.value === key);
      return match ? match.label : keyOrLegacy;
    }
    function cardLabel(c) {
      if (!c) return "—";
      return CARD_TYPES.find((t) => t.value === c)?.label || c;
    }
    const CATEGORIES = ["travel_lodging","tolls_parking","office_supplies","meals_entertainment","vehicle_maintenance","marketing","misc"];

    let connected = false;
    let reqId = 0;
    const callbacks = new Map();

    function parseMsg(raw) {
      if (raw == null) return null;
      if (typeof raw === "string") { try { return JSON.parse(raw); } catch { return null; } }
      return raw;
    }

    function postToParent(msg) {
      try { window.parent.postMessage(msg, "*"); } catch (_) {}
      try { window.top.postMessage(msg, "*"); } catch (_) {}
    }

    function onConnected() {
      if (connected) return;
      connected = true;
      hide($("configWait"));
      show($("appView"));
      loadAll();
    }

    function $(id) { return document.getElementById(id); }
    function show(el) { el.classList.remove("hidden"); }
    function hide(el) { el.classList.add("hidden"); }
    function fmt(n) { return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(n || 0); }
    function fmtDate(d) { if (!d) return "—"; return new Date(d + "T12:00:00").toLocaleDateString(); }
    function badge(s) { return `<span class="badge badge-${s}">${s}</span>`; }

    function callBackend(action, params = {}) {
      return new Promise((resolve, reject) => {
        const requestId = `req_${++reqId}`;
        callbacks.set(requestId, { resolve, reject });
        postToParent({ requestId, action, ...params });
        setTimeout(() => {
          if (callbacks.has(requestId)) {
            callbacks.delete(requestId);
            reject(new Error("Timed out — check Velo page code is published and element ID is pdxEmployeeEmbed"));
          }
        }, 30000);
      });
    }

    window.addEventListener("message", (event) => {
      const data = parseMsg(event.data);
      if (!data) return;
      if (data.type === "ready" || data.type === "pdx-connected") {
        onConnected();
        return;
      }
      if (data?.requestId && callbacks.has(data.requestId)) {
        const { resolve, reject } = callbacks.get(data.requestId);
        callbacks.delete(data.requestId);
        data.ok ? resolve(data.data) : reject(new Error(data.error || "Failed"));
      }
    });

    function getCategory(item) {
      for (const k of CATEGORIES) if (Number(item[k] || 0) > 0) return k.replace(/_/g, " ");
      if (Number(item.mileage_calc || 0) > 0) return "mileage";
      return "—";
    }

    async function loadStats() {
      const s = await callBackend("stats");
      $("statsRow").innerHTML = `
        <div class="stat"><div class="stat-value">${s.employee_count}</div><div class="stat-label">Employees</div></div>
        <div class="stat"><div class="stat-value">${s.report_count}</div><div class="stat-label">Reports</div></div>
        <div class="stat"><div class="stat-value">${s.pending_count}</div><div class="stat-label">Pending</div></div>
        <div class="stat"><div class="stat-value">${fmt(s.total_expenses)}</div><div class="stat-label">Submitted+Approved</div></div>`;
    }

    async function loadExpenses() {
      $("expensesTable").innerHTML = '<div class="loading">Loading…</div>';
      const items = await callBackend("listRecentExpenses", { limit: 100 });
      if (!items?.length) {
        $("expensesTable").innerHTML = '<p class="muted">No expenses in database yet.</p>';
        return;
      }
      $("expensesTable").innerHTML = `<table>
        <thead><tr><th>Employee</th><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th>Status</th></tr></thead>
        <tbody>${items.map((i) => {
          const e = i.employee || {};
          return `<tr>
            <td>${e.first_name || ""} ${e.last_name || ""}</td>
            <td>${fmtDate(i.expense_date)}</td>
            <td>${i.description || "—"}</td>
            <td>${getCategory(i)}</td>
            <td>${fmt(i.row_total)}</td>
            <td>${badge(i.report_status || "draft")}</td>
          </tr>`;
        }).join("")}</tbody></table>`;
    }

    async function loadReports() {
      $("reportsTable").innerHTML = '<div class="loading">Loading…</div>';
      const reports = await callBackend("listReports");
      if (!reports?.length) {
        $("reportsTable").innerHTML = '<p class="muted">No reports yet.</p>';
        return;
      }
      $("reportsTable").innerHTML = `<table>
        <thead><tr><th>Employee</th><th>Pay period</th><th>Total</th><th>Status</th><th>Submitted</th></tr></thead>
        <tbody>${reports.map((r) => {
          const e = r.employee || {};
          return `<tr>
            <td>${e.first_name || ""} ${e.last_name || ""}</td>
            <td>${fmtDate(r.pay_period_start)} – ${fmtDate(r.pay_period_end)}</td>
            <td>${fmt(r.grand_total)}</td>
            <td>${badge(r.status)}</td>
            <td>${r.submitted_at ? new Date(r.submitted_at).toLocaleDateString() : "—"}</td>
          </tr>`;
        }).join("")}</tbody></table>`;
    }

    async function loadEmployees() {
      $("employeesTable").innerHTML = '<div class="loading">Loading…</div>';
      const employees = await callBackend("listEmployees");
      if (!employees?.length) {
        $("employeesTable").innerHTML = '<p class="muted">No employees yet.</p>';
        return;
      }
      $("employeesTable").innerHTML = `<table>
        <thead><tr><th>Name</th><th>Email</th><th>Position</th><th>Company</th><th>Card</th></tr></thead>
        <tbody>${employees.map((e) => `<tr>
          <td>${e.first_name} ${e.last_name}</td>
          <td>${e.email}</td>
          <td>${roleLabel(e.role)}</td>
          <td>${companyLabel(normalizeCompanyKey(e))}</td>
          <td>${cardLabel(e.card_type)}</td>
        </tr>`).join("")}</tbody></table>`;
    }

    async function loadAll() {
      hide($("errorBox"));
      try {
        await callBackend("ping");
        await Promise.all([loadStats(), loadExpenses()]);
      } catch (e) {
        $("errorBox").textContent = e.message;
        show($("errorBox"));
      }
    }

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", async () => {
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        ["expenses", "reports", "employees"].forEach((n) => {
          show($(`tab-${n}`));
          if (n !== tab.dataset.tab) hide($(`tab-${n}`));
        });
        try {
          if (tab.dataset.tab === "reports") await loadReports();
          if (tab.dataset.tab === "employees") await loadEmployees();
        } catch (e) {
          $("errorBox").textContent = e.message;
          show($("errorBox"));
        }
      });
    });

    $("refreshBtn").addEventListener("click", loadAll);
    function handshake() { postToParent({ type: "ready" }); }
    handshake();
    setInterval(() => { if (!connected) handshake(); }, 1500);
  </script>
</body>
</html>
